<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HobbyHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1 id="hobbyhub">HobbyHub</h1>
        <div class="appearance-controls" aria-label="Appearance settings">
            <button id="theme-toggle" class="appearance-button theme-icon-button" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">☾</button>
            <label for="color-scheme">Color scheme</label>
            <select id="color-scheme" class="scheme-select">
                <option value="forest">Forest</option>
                <option value="ocean">Ocean</option>
                <option value="berry">Berry</option>
                <option value="sunset">Sunset</option>
            </select>
        </div>
    </header>

    <main>
        <section id="event-landing" class="event-landing" hidden aria-labelledby="event-landing-title">
            <a href="./" class="back-link">Back to HobbyHub</a>
            <div id="event-landing-content"></div>
        </section>

        <section id="hobbies-view" aria-labelledby="current-hobbies-heading">
            <div class="section-heading">
                <div>
                    <h2 id="current-hobbies-heading">Current Hobbies</h2>
                    <p class="section-description">A few hobbies to get your test profile started.</p>
                </div>
            </div>

            <form id="hobby-form" class="hobby-form">
                <div class="form-field">
                    <label for="hobby-title">Hobby name</label>
                    <input id="hobby-title" name="title" type="text" maxlength="80" required>
                </div>
                <div class="form-field">
                    <label for="hobby-description">Description</label>
                    <input id="hobby-description" name="description" type="text" maxlength="240" required>
                </div>
                <div class="form-field">
                    <label for="hobby-image">Cover image URL <span class="optional-label">(optional)</span></label>
                    <input id="hobby-image" name="imageUrl" type="url" placeholder="https://example.com/hobby.jpg">
                </div>
                <button class="add-button" type="submit">Add hobby</button>
            </form>

            <ul id="hobby-list" class="hobby-list" aria-live="polite"></ul>
        </section>
    </main>
</body>
</html>
